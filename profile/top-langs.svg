
      <svg
        width="300"
        height="350"
        viewBox="0 0 300 350"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="descId"
      >
        <title id="titleId"></title>
        <desc id="descId"></desc>
        <style>
          .header {
            font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #2f80ed;
            animation: fadeInAnimation 0.8s ease-in-out forwards;
          }
          @supports(-moz-appearance: auto) {
            /* Selector detects Firefox */
            .header { font-size: 15.5px; }
          }
          
    @keyframes slideInAnimation {
      from {
        width: 0;
      }
      to {
        width: calc(100%-100px);
      }
    }
    @keyframes growWidthAnimation {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #434d58;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .stat { font-size:12px; }
    }
    .bold { font-weight: 700 }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #434d58;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    #rect-mask rect{
      animation: slideInAnimation 1s ease-in-out forwards;
    }
    .lang-progress{
      animation: growWidthAnimation 0.6s ease-in-out forwards;
    }
    

          
      /* Animations */
      @keyframes scaleInAnimation {
        from {
          transform: translate(-5px, 5px) scale(0);
        }
        to {
          transform: translate(-5px, 5px) scale(1);
        }
      }
      @keyframes fadeInAnimation {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    
          
        </style>

        

        <rect
          data-testid="card-bg"
          x="0.5"
          y="0.5"
          rx="4.5"
          height="99%"
          stroke="#e4e2e2"
          width="299"
          fill="#fffefe"
          stroke-opacity="1"
        />

        
      <g
        data-testid="card-title"
        transform="translate(25, 35)"
      >
        <g transform="translate(0, 0)">
      <text
        x="0"
        y="0"
        class="header"
        data-testid="header"
      >Most Used Languages</text>
    </g>
      </g>
    

        <g
          data-testid="main-card-body"
          transform="translate(0, 55)"
        >
          
    <svg data-testid="lang-items">
      <g transform="translate(0, 0)">
        <svg data-testid="pie">
          
      <g class="stagger" style="animation-delay: 100ms">
        <path
          data-testid="lang-pie"
          size="77.84869659832586"
          d="M 150 100 L 240 100 A 90 90 0 1 1 166.02312336526586 11.437821178442817 Z"
          fill="#3178c6"
        />
      </g>
    
      <g class="stagger" style="animation-delay: 200ms">
        <path
          data-testid="lang-pie"
          size="7.909275130939005"
          d="M 150 100 L 166.02312336526586 11.437821178442817 A 90 90 0 0 1 206.30701308462142 29.789457504671915 Z"
          fill="#f1e05a"
        />
      </g>
    
      <g class="stagger" style="animation-delay: 300ms">
        <path
          data-testid="lang-pie"
          size="7.181236755684287"
          d="M 150 100 L 206.30701308462142 29.789457504671915 A 90 90 0 0 1 231.28747176662728 61.36909354170199 Z"
          fill="#f34b7d"
        />
      </g>
    
      <g class="stagger" style="animation-delay: 400ms">
        <path
          data-testid="lang-pie"
          size="7.060791515050853"
          d="M 150 100 L 231.28747176662728 61.36909354170199 A 90 90 0 0 1 240 100.00000000000006 Z"
          fill="#dea584"
        />
      </g>
    
        </svg>
      </g>
      <g transform="translate(0, 220)">
        <svg data-testid="lang-names" x="25">
          <g transform="translate(0, 0)"><g transform="translate(0, 0)">
    <g class="stagger" style="animation-delay: 450ms">
      <circle cx="5" cy="6" r="5" fill="#3178c6" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        TypeScript 77.85%
      </text>
    </g>
  </g><g transform="translate(0, 25)">
    <g class="stagger" style="animation-delay: 600ms">
      <circle cx="5" cy="6" r="5" fill="#f1e05a" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        JavaScript 7.91%
      </text>
    </g>
  </g></g><g transform="translate(150, 0)"><g transform="translate(0, 0)">
    <g class="stagger" style="animation-delay: 450ms">
      <circle cx="5" cy="6" r="5" fill="#f34b7d" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        C++ 7.18%
      </text>
    </g>
  </g><g transform="translate(0, 25)">
    <g class="stagger" style="animation-delay: 600ms">
      <circle cx="5" cy="6" r="5" fill="#dea584" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        Rust 7.06%
      </text>
    </g>
  </g></g>
        </svg>
      </g>
    </svg>
  
        </g>
      </svg>
    